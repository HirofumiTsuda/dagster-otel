[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-otel"
dynamic = ["version"]
description = "OpenTelemetry tracing for Dagster ops and assets, without giving up ownership of your op/asset definitions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hirofumi Tsuda" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # A real runtime dependency, not optional -- _propagation.py imports dagster
    # directly (AssetKey, AssetMaterialization, DagsterEventType).
    "dagster >= 1.5",
    "opentelemetry-api >= 1.15, < 2",
    "opentelemetry-sdk >= 1.15, < 2",
    "opentelemetry-exporter-otlp-proto-grpc >= 1.15, < 2",
]

[dependency-groups]
test = [
    "pytest >= 7",
]
# Pinned exactly (not >=), and installed the same way locally and in CI (`uv sync
# --group lint`), so a version drift between the two can't silently pass locally and
# fail in CI or vice versa -- the same problem dagster-prometheus-exporter's
# .tool-versions file exists to avoid for golangci-lint/helm.
lint = [
    "mypy==2.3.1",
    "pyright==1.1.414",
]

[project.urls]
Home = "https://github.com/HirofumiTsuda/dagster-otel"

[tool.hatch.version]
path = "src/dagster_otel/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_otel"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
# Lets `mypy tests/` resolve `from conftest import ...` (tests/ has no __init__.py --
# pytest's own import mechanism adds the test file's directory to sys.path at runtime,
# which mypy doesn't do on its own; this is the static-checking equivalent).
mypy_path = "tests"
