name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      - run: uv sync --group test

      - run: uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0

      # Not part of a dependency group (unlike mypy/pyright below): matches
      # dagster-prometheus-exporter's own pattern of pinning ruff by version string
      # directly in CI rather than adding it to the project's own dependencies.
      - run: uvx ruff@0.16.7 check .

      # Repo-wide formatting adopted in Issue #51 -- --check fails (nonzero exit,
      # diff to stderr) without writing anything, so this catches drift instead of
      # silently reformatting on every PR. Markdown excluded (pyproject.toml's
      # `extend-exclude`) since ruff format rewrites embedded Python snippets too,
      # which flattened deliberately hand-aligned example code in
      # README.md/docs/design.md -- those are teaching examples, not shipped code.
      - run: uvx ruff@0.16.7 format --check .

      # mypy/pyright ARE pinned via [dependency-groups].lint in pyproject.toml (not
      # ad-hoc `uvx <tool>@version` like ruff above) so the exact same pinned versions
      # get used locally too via `uv sync --group lint` -- see that group's comment
      # for why (the same local/CI version-drift problem .tool-versions exists to
      # avoid for golangci-lint/helm).
      #
      # Both groups, not just lint: mypy checking tests/ needs pytest importable too
      # (conftest.py does `import pytest`) -- caught by this exact job failing on the
      # PR that introduced it, since the two jobs run as separate, isolated runners
      # and this one alone never installs the test group otherwise.
      - run: uv sync --group lint --group test

      - run: uv run mypy -p dagster_otel --explicit-package-bases
      - run: uv run mypy --explicit-package-bases tests/

      # Scoped to src/tests, not `.` -- examples/ needs the separate `dbt` group
      # (dagster-dbt/dbt-duckdb), which this job doesn't sync. `uv run pyright .`
      # picked up examples/ anyway (pyright walks the whole tree regardless of what's
      # actually importable) and failed on the missing dagster_dbt import; caught by
      # this exact job failing on the PR that added examples/.
      - run: uv run pyright src tests
