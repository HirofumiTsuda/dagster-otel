services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"   # OTLP gRPC -- point OTEL_EXPORTER_OTLP_ENDPOINT here
      - "4318:4318"   # OTLP HTTP
      - "16686:16686" # UI -- http://localhost:16686

  # Grafana Tempo backend (Issue #42) plus a real OTel Collector in front of it
  # (Issue #56's architecture) -- offset host ports from jaeger's above so both stacks
  # can run at once via a plain `docker compose up`; point OTEL_EXPORTER_OTLP_ENDPOINT
  # at the collector (4327/4328), not directly at tempo, to exercise the Collector
  # hop this project doesn't otherwise get tested against.
  tempo:
    image: grafana/tempo:3.0.0 # pinned, not :latest -- see docs/design.md for why
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./dev/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo query API -- used by Grafana's Tempo datasource (Issue #56)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./dev/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4327:4317" # OTLP gRPC -- point OTEL_EXPORTER_OTLP_ENDPOINT here for the Tempo/Collector path
      - "4328:4318" # OTLP HTTP
    depends_on:
      - tempo
      - prometheus

  # Issue #56's combined demo: this project (traces) + dagster-prometheus-exporter
  # (metrics), both flowing through the otel-collector above into Grafana. jaffle-shop
  # is this repo's own examples/ pipeline, run as a persistent `dagster dev` webserver
  # (not the one-shot `dagster asset materialize` examples/README.md's basic
  # walkthrough uses) so the exporter has a live GraphQL endpoint to scrape.
  jaffle-shop:
    build:
      context: .
      dockerfile: dev/jaffle-shop-dev.Dockerfile
    environment:
      OTEL_SERVICE_NAME: jaffle_shop_combined_demo
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "3001:3000" # avoid clashing with dagster-prometheus-exporter's own dev stack (also 3000) if that's running alongside
    depends_on:
      - otel-collector

  exporter:
    image: ghcr.io/hirofumitsuda/dagster-prometheus-exporter:latest
    environment:
      DAGSTER_GRAPHQL_ENDPOINT: http://jaffle-shop:3000/graphql
    ports:
      - "9101:9101"
    depends_on:
      - jaffle-shop

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver # the collector's prometheusremotewrite exporter writes here, no scrape_configs needed
    volumes:
      - ./dev/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./dev/grafana/provisioning:/etc/grafana/provisioning
      - ./dev/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3002:3000" # http://localhost:3002 -- both Prometheus and Tempo datasources provisioned (Issue #56)
    environment:
      # Anonymous access is view-only in this Grafana version -- confirmed via its own
      # startup log: "auth.anonymous.org_role is deprecated, only viewer role is
      # supported", regardless of what GF_AUTH_ANONYMOUS_ORG_ROLE is set to. Kept for
      # convenience (open the dashboard with zero setup), but the login form stays
      # enabled (not GF_AUTH_DISABLE_LOGIN_FORM=true) with a fixed admin password so
      # there's still a way to get Editor/Admin capabilities (Explore's free-text
      # query editor among them) when Viewer-only isn't enough.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # traceqlEditor for the free-text TraceQL query tab (Explore and the traces
      # panel), metricsSummary for the trace-derived-metrics summary view -- matches
      # Grafana's own official Tempo single-binary example. GF_FEATURE_TOGGLES_ENABLE
      # (plural, space-separated) is deprecated in this Grafana version; one
      # GF_FEATURE_TOGGLES_<NAME>=true var per toggle is what actually takes effect.
      - GF_FEATURE_TOGGLES_TRACEQLEDITOR=true
      - GF_FEATURE_TOGGLES_METRICSSUMMARY=true

volumes:
  tempo-data:
