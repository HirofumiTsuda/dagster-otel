[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-otel"
dynamic = ["version"]
description = "OpenTelemetry tracing for Dagster ops and assets, without giving up ownership of your op/asset definitions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hirofumi Tsuda" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    # A real runtime dependency, not optional -- _propagation.py imports dagster
    # directly (AssetKey, AssetMaterialization, DagsterEventType).
    "dagster >= 1.5",
    "opentelemetry-api >= 1.15, < 2",
    "opentelemetry-sdk >= 1.15, < 2",
    "opentelemetry-exporter-otlp-proto-grpc >= 1.15, < 2",
]

[dependency-groups]
test = [
    "pytest >= 7",
]

[project.urls]
Home = "https://github.com/HirofumiTsuda/dagster-otel"

[tool.hatch.version]
path = "src/dagster_otel/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_otel"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
