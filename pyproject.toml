[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster-otel"
dynamic = ["version"]
description = "OpenTelemetry tracing for Dagster ops and assets, without giving up ownership of your op/asset definitions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Hirofumi Tsuda" },
]
keywords = [
    "dagster",
    "opentelemetry",
    "otel",
    "tracing",
    "observability",
    "distributed-tracing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # A real runtime dependency, not optional -- _propagation.py imports dagster
    # directly (AssetKey, AssetMaterialization, DagsterEventType).
    "dagster >= 1.5",
    "opentelemetry-api >= 1.15, < 2",
    "opentelemetry-sdk >= 1.15, < 2",
    "opentelemetry-exporter-otlp-proto-grpc >= 1.15, < 2",
    # For OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf (Issue #48) -- opentelemetry-python
    # only implements "grpc" and "http/protobuf" of the spec's protocol values, not
    # "http/json", so that's the full set _setup.py needs to support.
    "opentelemetry-exporter-otlp-proto-http >= 1.15, < 2",
]

[dependency-groups]
test = [
    "pytest >= 7",
]
# Pinned exactly (not >=), and installed the same way locally and in CI (`uv sync
# --group lint`), so a version drift between the two can't silently pass locally and
# fail in CI or vice versa -- the same problem dagster-prometheus-exporter's
# .tool-versions file exists to avoid for golangci-lint/helm.
lint = [
    "mypy==2.3.1",
    "pyright==1.1.414",
]
# Kept out of the base dependencies, same reasoning as dagster-prometheus-exporter's
# equivalent dbt group: dagster-dbt releases track the exact dagster patch they were
# built against 1:1 (verified: 0.29.22 requires dagster==1.13.22, matching what's
# actually installed here). `uv sync` (no flags) skips this group; running the
# jaffle_shop example needs `uv sync --group dbt`.
dbt = [
    "dagster-dbt==0.29.22",
    "dbt-duckdb",
]

[project.urls]
Home = "https://github.com/HirofumiTsuda/dagster-otel"

[tool.hatch.version]
path = "src/dagster_otel/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_otel"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Markdown code fences excluded from formatting (not just linting): ruff format
# rewrites embedded Python snippets too, and it flattened deliberately hand-aligned
# example comments/multi-line stub bodies in README.md/docs/design.md (checked via
# `ruff format --diff` before adopting repo-wide formatting, Issue #51) -- those are
# teaching examples, not code this project ships or tests.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
# Lets `mypy tests/` resolve `from conftest import ...` (tests/ has no __init__.py --
# pytest's own import mechanism adds the test file's directory to sys.path at runtime,
# which mypy doesn't do on its own; this is the static-checking equivalent).
mypy_path = "tests"
